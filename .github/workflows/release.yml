name: release

# Builds the double-click apps. Push a tag like v0.2.0 to publish a release,
# or run it by hand from the Actions tab to just get the files as artifacts.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
  # build (but don't publish) on PRs that touch packaging, so it never rots
  pull_request:
    paths:
      - "scripts/**"
      - ".github/workflows/release.yml"
      - "pyproject.toml"

permissions:
  contents: write

jobs:
  app:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, macos-15-intel, ubuntu-22.04]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install pyinstaller .
      - name: Build
        run: python scripts/build_app.py
      - name: Smoke test the app
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then APP=dist/NoteFall.app/Contents/MacOS/NoteFall;
          elif [ "$RUNNER_OS" = "Windows" ]; then APP=dist/NoteFall/NoteFall.exe;
          else APP=dist/NoteFall/NoteFall; fi
          "$APP" examples/prelude_in_c.mid -o smoke.mp4 --size 270x480 --fps 10
          test -s smoke.mp4
      - uses: actions/upload-artifact@v4
        with:
          name: app-${{ matrix.os }}
          path: |
            dist/*.zip
            dist/*.tar.gz

  python-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build && python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: python-package
          path: dist/*

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [app, python-package]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: out/*
          generate_release_notes: true
