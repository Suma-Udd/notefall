[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "notefall"
version = "0.5.1"
description = "Turn a MIDI file or a piano recording into a falling notes piano video. App window or one command."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE", "notefall/assets/models/LICENSE-basic-pitch.txt", "notefall/assets/models/NOTICE-basic-pitch.txt", "notefall/assets/fonts/LICENSE-Inter.txt", "notefall/assets/fonts/LICENSE-Kalam.txt"]
authors = [{ name = "Sumayer Uddin" }]
keywords = ["midi", "piano", "visualizer", "falling notes", "piano roll", "ffmpeg", "music", "video", "transcription"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Environment :: X11 Applications :: Tk",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Video",
    "Topic :: Multimedia :: Sound/Audio :: MIDI",
]
dependencies = [
    "pretty_midi>=0.2.10",
    "numpy>=1.24",
    "Pillow>=10.1",
    # recording -> notes. Runs Basic Pitch's ONNX model directly, no TensorFlow.
    "onnxruntime>=1.16",
    # a working ffmpeg on every OS, used when there isn't one on PATH
    "imageio-ffmpeg>=0.4.9",
    # certificates for the one time piano model download (frozen macOS apps have none)
    "certifi",
]

[project.optional-dependencies]
dev = ["pytest>=7"]
# kept so old install commands keep working, everything is built in now
transcribe = []

[project.scripts]
notefall = "notefall.cli:main"

[project.gui-scripts]
notefall-app = "notefall.app:main"

[project.urls]
Homepage = "https://github.com/Suma-Udd/notefall"
Issues = "https://github.com/Suma-Udd/notefall/issues"

[tool.setuptools]
packages = ["notefall"]

[tool.setuptools.package-data]
notefall = ["assets/models/*", "assets/fonts/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
