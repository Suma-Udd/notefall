[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "notefall"
version = "0.1.0"
description = "Turn a MIDI file or a piano recording into a Synthesia style falling notes video."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [{ name = "Sumayer Uddin" }]
keywords = ["midi", "piano", "visualizer", "synthesia", "ffmpeg", "music", "video"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Video :: Non-Linear Editor",
    "Topic :: Multimedia :: Sound/Audio :: MIDI",
]
dependencies = [
    "pretty_midi>=0.2.10",
    "numpy>=1.24",
    "Pillow>=9.0",
]

[project.optional-dependencies]
# basic-pitch pins tensorflow<2.15.1, which has no wheels for 3.12+.
# On newer Python the CLI will tell you the two-step install (see README).
transcribe = [
    "basic-pitch>=0.4; python_version < '3.12'",
    "librosa>=0.10",
    "scipy>=1.10",
    "resampy>=0.2.2,<0.4.3",
    "mir_eval>=0.7",
    "onnxruntime>=1.16",
]
dev = ["pytest>=7"]

[project.scripts]
notefall = "notefall.cli:main"

[project.urls]
Homepage = "https://github.com/Suma-Udd/notefall"
Issues = "https://github.com/Suma-Udd/notefall/issues"

[tool.setuptools]
packages = ["notefall"]

[tool.pytest.ini_options]
testpaths = ["tests"]
